project.name=lab3
project.version=1.0-SNAPSHOT
project.title=Web Programming Lab 3
project.vendor=Isaeva Aleksandra-Irina, P3209
main.class=isaxel.Main

src.main.dir=src/main/java
src.test.dir=src/test/java
resources.dir=src/main/resources
webapp.dir=src/main/webapp

build.dir=ant-build
classes.main.dir=${build.dir}/classes/main
classes.test.dir=${build.dir}/classes/test
reports.dir=${build.dir}/reports
junit.reports.dir=${reports.dir}/junit
javadoc.dir=${build.dir}/javadoc
checksums.dir=${build.dir}/checksums
native2ascii.dir=${build.dir}/native2ascii
history.dir=${build.dir}/history
team.dir=${build.dir}/team
alt.dir=${build.dir}/alt
manifest.file=${build.dir}/MANIFEST.MF
manifest.doc.file=${build.dir}/MANIFEST-DOC.MF

dist.dir=dist
jar.file=${dist.dir}/${project.name}.jar
war.file=${dist.dir}/${project.name}.war
team.zip=${dist.dir}/${project.name}-team.zip
alt.jar=${dist.dir}/${project.name}-alt.jar

lib.dir=lib
lib.compile.dir=${lib.dir}/compile
lib.runtime.dir=${lib.dir}/runtime
lib.test.dir=${lib.dir}/test
maven.base.url=https://repo1.maven.org/maven2

jakartaee.version=10.0.0
lombok.version=1.18.34
primefaces.version=14.0.5
postgresql.version=42.7.2
gson.version=2.8.9
jquery.version=3.6.0
junit.console.version=1.10.2

test.jvm.args=

java.release=17
encoding=UTF-8
javac.extra.args=

i18n.dir=i18n
native2ascii.includes=${i18n.dir}/*.properties

xml.includes=build.xml,${resources.dir}/**/*.xml,${webapp.dir}/**/*.xml
xml.excludes=${build.dir}/**,${dist.dir}/**,${lib.dir}/**,.idea/**,build/**

music.file.windows=C:\\Windows\\Media\\Alarm01.wav
music.command.unix=aplay
music.file.unix=/usr/share/sounds/alsa/Front_Center.wav

scp.executable=scp
scp.options=-o StrictHostKeyChecking=accept-new
scp.user=irina
scp.host=localhost
scp.port=22
scp.remote.dir=C:/Users/irina/scp-test
scp.artifact=${jar.file}

git.executable=git
diff.watch.pattern=src/main/java/isaxel/(models|beans|db|i18n)/.*\\.java
diff.commit.message=Ant diff: watched classes changed
report.commit.message=Ant report: junit xml report
history.diff.file=${history.dir}/history.diff
history.changed.file=${history.dir}/history-changed-files.txt

svn.executable=svn
svn.url=file:///C:/svn-repo/lab3/trunk
team.revision.count=4

env.1.name=JDK-default, serial GC, ru locale
env.1.java.home=${java.home}
env.1.jvm.args=-Xms16m -Xmx128m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Duser.language=ru -Duser.country=RU
env.1.program.args=1 2 3

env.2.name=JDK-default, G1 GC, en locale
env.2.java.home=${java.home}
env.2.jvm.args=-Xmx512m -XX:+UseG1GC -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
env.2.program.args=2 2 3

alt.project.name=${project.name}-alt
alt.class.old=CheckPoint
alt.class.new=AreaPoint
alt.class.dir=isaxel/models
alt.replace.includes=${src.main.dir}/**/*.java,${resources.dir}/**,${webapp.dir}/**/*.xhtml
alt.var.old=executionTime
alt.var.new=elapsedTime
alt.getter.old=getExecutionTime
alt.getter.new=getElapsedTime
