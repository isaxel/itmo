name: "assert text_word_counter('a bb ccc a ccc a\n') == ('3 1 2', '')"
limit: 2000
memory_size: 0x1000
memory_mapped_io:
  0x80: [97, 32, 98, 98, 32, 99, 99, 99, 32, 97, 32, 99, 99, 99, 32, 97, 10]
  0x84: []
reports:
  - name: Check results
    slice: last
    filter:
      - state
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
      symio[0x80]: {io:0x80:sym}
      symio[0x84]: {io:0x84:sym}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [51,32,49,32,50]
      symio[0x80]: "" >>> ""
      symio[0x84]: "" >>> "3 1 2"
  - name: Execution statistics
    slice: last
    view: |
      sim:instruction-count: {sim:instruction-count}
      layout:sections-size:  {layout:sections-size} (text {layout:text-sections-size} / data {layout:data-sections-size})
      mem:instr-ranges:      {mem:instr-ranges}
      mem:data-ranges:       {mem:data-ranges}
      mem:io-ranges:         {mem:io-ranges}
      {isa-specific}
      {memory:table}