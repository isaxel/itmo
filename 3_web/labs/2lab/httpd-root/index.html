<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Лабораторная работа №2</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=EB+Garamond:wght@400;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="image/favicon.png">
</head>
<body>

<header class="header">
    <div class="headerName">Исаева Александра-Ирина Антоновна</div>
    <div class="headerInfo">
        <span class="headerItem">группа: P3309</span>
        <span class="headerItem">вариант: 32405</span>
    </div>
</header>

<main class="main">
    <div class="mainLayout">

        <div class="mainLeft">
            <section class="panel panelGraph">
                <h2 class="panelTitle">Область</h2>
                <div class="graph">
                    <canvas id="graph" class="graphCanvas" width="400" height="400"></canvas>
                </div>
            </section>

            <section class="panel panelForm">
                <h2 class="panelTitle">Параметры точки</h2>

                <form id="pointForm" class="form" method="post" action="/fcgi-bin/2lab.jar" novalidate>
                    <div class="formRow">
                        <label for="xInput" class="formLabel">Координата X:</label>
                        <input id="xInput" class="formInput" type="text" name="x"
                               maxlength="20" autocomplete="off" placeholder="−5...3">
                        <span id="xError" class="formError"></span>
                    </div>

                    <div class="formRow">
                        <label for="yInput" class="formLabel">Координата Y:</label>
                        <input id="yInput" class="formInput" type="text" name="y"
                               maxlength="20" autocomplete="off" placeholder="−5...3">
                        <span id="yError" class="formError"></span>
                    </div>

                    <div class="formRow">
                        <span class="formLabel">Радиус R:</span>
                        <div id="rRadios" class="rRadios" role="radiogroup" aria-label="Радиус R">
                            <label class="rOption"><input type="radio" name="r" value="1"> 1</label>
                            <label class="rOption"><input type="radio" name="r" value="1.5"> 1.5</label>
                            <label class="rOption"><input type="radio" name="r" value="2" checked> 2</label>
                            <label class="rOption"><input type="radio" name="r" value="2.5"> 2.5</label>
                            <label class="rOption"><input type="radio" name="r" value="3"> 3</label>
                        </div>
                    </div>

                    <div class="formActions">
                        <button type="submit" id="submitBtn" class="btn btnPrimary" disabled>Проверить</button>
                        <button type="button" id="clearBtn" class="btn">Очистить таблицу</button>
                    </div>
                    <p id="serverError" class="formError serverError" role="alert"></p>
                </form>
            </section>
        </div>

        <section class="panel panelResults">
            <h2 class="panelTitle">Результаты проверок</h2>
            <p class="serverTime">Время сервера: <span id="serverNow">—</span></p>
            <div class="tableWrap">
                <table class="results">
                    <thead>
                    <tr>
                        <th>X</th>
                        <th>Y</th>
                        <th>R</th>
                        <th>Результат</th>
                        <th>Дата и время</th>
                        <th>Время работы, мкс</th>
                    </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
            <p id="emptyMsg" class="resultsEmpty">Проверок пока не было</p>
        </section>

    </div>
</main>

<footer class="footer">
    <p><a href="https://github.com/isaxel" target="_blank">github</a>  •  <a href="mailto:isaxel@duck.com">isaxel@duck.com</a></p>
</footer>

<script src="index.js"></script>
</body>
</html>
